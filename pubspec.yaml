name: trip_manager_app
description: "Trip Manager App for Team Weekend Trekkers - Manage trips from mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.1.2
  
  # HTTP client
  dio: ^5.4.0
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Image picker for photos
  image_picker: ^1.0.7
  
  # Date picker
  intl: ^0.19.0
  
  # File path utilities
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Share functionality
  share_plus: ^8.0.2
  
  # URL launcher for WhatsApp/website
  url_launcher: ^6.2.4
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # Git operations (via GitHub API)
  http: ^1.2.0
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
