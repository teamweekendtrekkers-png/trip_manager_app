name: Refresh usability review baselines
on:
  push:
    branches: [codex/manager-search-usability]
permissions:
  contents: read
jobs:
  review:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
      - run: flutter pub get
      - name: Generate screenshots for changed manager screens
        run: flutter test --update-goldens test/regression_goldens_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-baselines-${{ matrix.os }}
          path: test/goldens/**/*.png
          if-no-files-found: error
          retention-days: 7
