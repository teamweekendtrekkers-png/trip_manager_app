name: Review updated manager screenshots
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - run: flutter pub get
      - run: flutter test --update-goldens test/regression_goldens_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: updated-goldens-${{ matrix.os }}
          path: test/goldens
