name: Build Android & Windows Desktop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --no-pub

  build-android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: trip-manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: trip-manager-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
  build-windows:
    needs: test
    # Flutter 3.38 and its notification plugin target the stable VS 2022
    # toolchain. Pin the runner so a windows-latest compiler migration cannot
    # break an otherwise unchanged desktop release.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Test Windows text input
        run: flutter test test/windows_editing_test.dart
      - name: Build Windows desktop app
        run: flutter build windows --release
      - name: Package Windows desktop app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/trip-manager-windows-x64.zip
      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: trip-manager-windows-x64
          path: build/trip-manager-windows-x64.zip
          if-no-files-found: error
          retention-days: 90
# Windows is the supported desktop target for this application.
