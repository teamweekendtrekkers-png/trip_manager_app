name: Review updated editor baselines
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  editor-baseline:
    if: github.head_ref == 'codex/improve-trip-pdfs'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
      - run: flutter pub get
      - name: Render the changed editor baseline for review
        run: flutter test test/regression_goldens_test.dart --update-goldens --plain-name "Trip Editor — populated invalid date section, light"
      - name: Export this test-only image for visual review
        run: node -e "const fs=require('fs');const p=process.platform==='win32'?'test/goldens/windows/trip_editor_dates_invalid_light.png':'test/goldens/trip_editor_dates_invalid_light.png';console.log('EDITOR_REVIEW_IMAGE_START');console.log(fs.readFileSync(p).toString('base64'));console.log('EDITOR_REVIEW_IMAGE_END');"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-baseline-${{ matrix.os }}
          path: test/goldens/**/trip_editor_dates_invalid_light.png
